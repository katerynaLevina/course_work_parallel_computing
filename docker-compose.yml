services:
  search-server:
    build:
      context: .
      dockerfile: src/SearchServer/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
    environment:
      DATA_DIR: /data
      DATA_GLOB: "*.txt"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_TIMEOUT_MS: "60000"
      OLLAMA_NUM_THREAD: "4"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma4:e2b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-models:
